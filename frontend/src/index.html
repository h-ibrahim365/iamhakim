  <!-- Resolve the theme before first paint (localStorage choice, else OS preference)
       so the page never flashes the wrong theme. Kept in sync afterwards by ThemeService. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('iamhakim.theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
